services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: craftynp_store
    ports:
      # Host 5433, not 5432: an unrelated project's container already owns 5432
      # on this machine. The container-internal port stays 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d craftynp_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stands in for Cloudflare R2 locally. R2 is S3-compatible, so the same
  # client and the same bucket layout work against both — only the endpoint
  # and credentials differ. Testing against a real S3 API rather than the
  # local disk is the point: R2 has no object-level ACLs, so a bucket is
  # private or public as a whole, and that is the behaviour label storage
  # depends on.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: craftynp
      MINIO_ROOT_PASSWORD: craftynp-local-secret
    ports:
      # Host 9002/9003, not 9000/9001: Medusa already owns 9000 on this
      # machine. The container-internal ports stay 9000 and 9001.
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the private labels bucket once MinIO is up, then exits. Nothing
  # here makes the bucket public — a shipping label carries the customer's
  # name and full address and is only ever served through the authenticated
  # admin route.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 craftynp craftynp-local-secret &&
      mc mb --ignore-existing local/craftynp-labels &&
      mc anonymous set none local/craftynp-labels
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
