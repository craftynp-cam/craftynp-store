name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Reads the version from the root package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile also enforces .npmrc's engine-strict against
      # engines.node, so a wrong Node version fails here rather than oddly later.
      - run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # The build needs this file to exist; the placeholders are enough. It
      # needs no backend, database or Redis.
      - name: Provide storefront build environment
        run: cp apps/storefront/.env.example apps/storefront/.env.local

      # Build first, as its own step. turbo.json's typecheck task depends on
      # ^build — upstream packages only, not this workspace's own build — so
      # the storefront's build-generated next-env.d.ts would otherwise be
      # missing. Do not collapse these two steps into one turbo invocation.
      - run: pnpm run build

      - run: pnpm exec turbo run lint typecheck test

      - run: pnpm run format:check
