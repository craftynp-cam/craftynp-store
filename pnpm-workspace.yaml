packages:
  - "apps/*"
  - "packages/*"

# pnpm blocks dependency lifecycle scripts by default. These packages ship
# native binaries or generated code that only exist after their postinstall
# runs, so each is allowed explicitly. @medusajs/telemetry is deliberately
# omitted — its postinstall only exists to phone home.
onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - msgpackr-extract
  - protobufjs
  - sharp
  - unrs-resolver

# Security floors for transitive dependencies flagged by `pnpm audit`. Each
# entry pins a vulnerable package to its patched release; remove one once the
# dependency that pulls it in has caught up on its own. The ajv and uuid
# entries are scoped so unrelated majors (eslint's ajv 6) stay untouched.
# vite is overridden — not just bumped in apps/medusa — because
# @medusajs/admin-bundler carries its own vite dependency that would otherwise
# stay on the vulnerable 5.x line.
#
# Known leftovers `pnpm audit` still reports, both unfixable from here:
# react-router(-dom) 6.x in the Medusa admin (patched only in 7.18, which
# Medusa's dashboard cannot take until Medusa itself moves), and
# brace-expansion 1.x under jest's glob chain (the patched 5.x line changed
# its export shape and breaks minimatch 3 — dev-only DoS exposure).
overrides:
  sharp: "^0.35.3"
  postcss: "^8.5.18"
  lodash: "^4.18.0"
  vite: "^6.4.3"
  "ajv@8": "^8.18.0"
  "bullmq>uuid": "^11.1.1"

# Pins the *type* side of the React major split.
#
# Both React majors are installed: Next 16 wants 19, the Medusa admin wants 18.
# A package that declares `react` as a peer but says nothing about
# `@types/react` gets no type package linked into its subgraph, so its .d.ts
# files resolve `react` by walking up to pnpm's private hoist directory. Which
# major lands there is not stable — separate installs of the same lockfile have
# put 18 there in one checkout and 19 in the next — so any such package makes
# typecheck pass or fail depending on the install, with TS2786 "cannot be used
# as a JSX component" on the losing side.
#
# Declaring the peer explicitly makes pnpm resolve it from the importer, so
# each package gets the major of the app that uses it: HeroUI and React Aria get
# 19 from the storefront, and the admin's UI, icons, router, data and toast
# packages get 18 from apps/medusa. Do not "simplify" this by hoisting or by
# adding @types/react to the root package.json: the first removes the types
# entirely, the second makes React 19's types ambient for apps/medusa, which
# runs React 18.
packageExtensions:
  react-aria-components:
    peerDependencies:
      "@types/react": "*"
  react-aria:
    peerDependencies:
      "@types/react": "*"
  "@heroui/react":
    peerDependencies:
      "@types/react": "*"
  react-stately:
    peerDependencies:
      "@types/react": "*"
  "@react-types/shared":
    peerDependencies:
      "@types/react": "*"
  "@medusajs/admin-sdk":
    peerDependencies:
      "@types/react": "*"
  "@medusajs/icons":
    peerDependencies:
      "@types/react": "*"
  "@medusajs/ui":
    peerDependencies:
      "@types/react": "*"
  "@tanstack/react-query":
    peerDependencies:
      "@types/react": "*"
  "@tanstack/react-table":
    peerDependencies:
      "@types/react": "*"
  react-currency-input-field:
    peerDependencies:
      "@types/react": "*"
  react-router:
    peerDependencies:
      "@types/react": "*"
  react-router-dom:
    peerDependencies:
      "@types/react": "*"
  sonner:
    peerDependencies:
      "@types/react": "*"
